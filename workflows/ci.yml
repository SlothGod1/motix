# Build, lint and test on every push to main and every pull request.
# Actions are pinned to full commit SHAs (supply-chain rule, SECURITY.md §3.7).
# Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 = glibc 2.35, the oldest Linux we support (R-PLT-1).
        # macOS is added in Phase 13 (OD-8); see IDEAS.md I-35 for an early build-check.
        os: [windows-2025, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test (debug, overflow checks on)
        run: cargo test --workspace --locked
      - name: Test (release)
        run: cargo test --workspace --locked --release
      - name: Docs
        run: cargo doc --workspace --no-deps --locked

  deny:
    name: Licenses, advisories, bans, sources
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  package:
    name: Build app (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            exe: motix.exe
          - name: linux-x64
            os: ubuntu-22.04
            exe: motix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release
        run: cargo build --release --locked -p motix
      - name: Assemble developer preview
        shell: bash
        run: |
          mkdir -p dist/MOTIX
          cp "target/release/${{ matrix.exe }}" dist/MOTIX/
          cp LICENSE dist/MOTIX/LICENSE.txt
          cat > dist/MOTIX/READ-ME-FIRST.txt <<'EOF'
          MOTIX developer preview (milestone M1)

          This is an early test build, not a finished app.
          - Windows: double-click motix.exe. If Windows shows "Windows protected your PC",
            click "More info" then "Run anyway" (developer builds are not code-signed yet).
          - Linux: run ./motix
          Drag videos, audio or images into the window. Video playback arrives in the next update.
          MOTIX is free software under the GNU GPL v3 or later (see LICENSE.txt).
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motix-${{ matrix.name }}-preview
          path: dist/MOTIX
          retention-days: 30
